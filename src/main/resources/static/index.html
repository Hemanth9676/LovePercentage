
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Love Percentage Calculator</title>
    <link rel="stylesheet" href="/css/style.css">
</head>
<body>

<div class="container">

    <h1>Love Calculator ❤️</h1>

    <p class="subtitle">Discover your love percentage!</p>

    <div class="heart">💖</div>

    <input type="text" id="firstName"
           placeholder="Enter first name" maxlength="100">

    <input type="text" id="secondName"
           placeholder="Enter second name" maxlength="100">

    <button onclick="calculateLove()">
        Calculate Love ❤️
    </button>

    <div id="result"></div>

</div>

<script src="/js/script.js"></script>
</body>
</html>
